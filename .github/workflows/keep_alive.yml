name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub interface

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s https://healthcare-fraud-detector-shreya-c.streamlit.app/_stcore/health > /dev/null
